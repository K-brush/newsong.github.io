
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>노래, 다시 부르다</title>

<!-- ============================================
     ⭐ 자동 이동 설정 (아주 중요)
     - 아래 주소가 방문자가 최종적으로 도착할 노션 페이지입니다.
     - 이 줄 덕분에, 자바스크립트가 꺼져 있는 특수한 경우에도
       페이지가 열리고 약간의 시간 뒤 자동으로 이동합니다.
     - 숫자 "1.5"는 몇 초 뒤에 넘어갈지 정하는 값이에요. (초 단위)
============================================ -->
<meta http-equiv="refresh" content="4; url=https://k-brush.notion.site/39606fc3f79c80dd95bcfe6475968c6f?source=copy_link">

<!-- 구글 폰트: 제목용 Noto Serif KR / 본문용 Nanum Myeongjo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700;900&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --color-bg: #F3EEE1;
    --color-ink: #2E2A24;
    --color-ink-soft: #5C5648;
    --color-seal: #9C3B2E;
    --color-line: #C9BFA5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--color-bg);
    color: var(--color-ink);
    font-family: 'Nanum Myeongjo', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0,0,0,0.015) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.02) 0%, transparent 45%);
  }

  .seal {
    width: 46px;
    height: 46px;
    border: 2px solid var(--color-seal);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-seal);
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 20px;
    margin-bottom: 26px;
    opacity: 0;
    animation: fadeIn 0.9s ease forwards;
  }

  h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.4;
    letter-spacing: -0.5px;
    opacity: 0;
    animation: fadeIn 0.9s ease forwards;
    animation-delay: 0.15s;
  }

  .subtitle {
    margin-top: 16px;
    font-size: clamp(14px, 2.2vw, 16px);
    color: var(--color-ink-soft);
    max-width: 380px;
    opacity: 0;
    animation: fadeIn 0.9s ease forwards;
    animation-delay: 0.3s;
  }

  /* 이동 중임을 보여주는 은은한 점 3개 애니메이션 */
  .loading-dots {
    margin-top: 34px;
    display: flex;
    gap: 8px;
    opacity: 0;
    animation: fadeIn 0.9s ease forwards;
    animation-delay: 0.5s;
  }
  .loading-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: var(--color-seal);
    opacity: 0.35;
    animation: blink 1.2s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

  /* 자동 이동이 안 될 경우를 대비한 수동 링크 */
  .fallback-link {
    margin-top: 30px;
    font-size: 13px;
    color: var(--color-ink-soft);
    text-decoration: underline;
    text-underline-offset: 4px;
    opacity: 0;
    animation: fadeIn 0.9s ease forwards;
    animation-delay: 1.4s;
  }
  .fallback-link:hover { color: var(--color-seal); }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 0.9; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; }
  }
</style>
</head>
<body>

  <div class="seal" aria-hidden="true">大</div>

  <h1>노래, 다시 부르다</h1>

  <p class="subtitle">
    유진 피터슨의 결을 담아,<br>새로 옮겨 쓴 찬송들입니다.
  </p>

  <div class="loading-dots" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <!-- 자동 이동이 브라우저 설정 등으로 막혔을 때를 위한 안전장치 -->
  <a class="fallback-link" href="https://k-brush.notion.site/39606fc3f79c80dd95bcfe6475968c6f?source=copy_link">
    자동으로 넘어가지 않으면,<br>여기를 눌러주세요 →
  </a>

  <script>
    // ============================================
    // 자바스크립트로도 한 번 더 이동을 시도합니다.
    // (위 <meta refresh>와 이 코드, 두 가지 방법을 함께 써서
    //  어떤 브라우저 환경에서도 최대한 안정적으로 이동하도록 했습니다.)
    // ============================================
    setTimeout(function () {
      window.location.href = "https://k-brush.notion.site/39606fc3f79c80dd95bcfe6475968c6f?source=copy_link";
    }, 5000); // 5000 = 5초 후 이동. 숫자를 바꾸면 대기 시간이 달라집니다.
  </script>

</body>
</html>
